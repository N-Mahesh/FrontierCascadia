[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/Frontier_Cascadia.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = 'attachment; filename="Frontier_Cascadia.pdf"'

[[redirects]]
  from = "/Frontier_Cascadia_Consent_Signature.pdf"
  to = "/Frontier_Cascadia.pdf"
  status = 301

# Clean URLs for the standalone pages. These must sit above the catch-all,
# which would otherwise swallow them and serve the landing page instead.
[[redirects]]
  from = "/about"
  to = "/team"
  status = 301

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/ambassador"
  to = "/ambassador.html"
  status = 200

[[redirects]]
  from = "/code-of-conduct"
  to = "/code-of-conduct.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
