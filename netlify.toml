[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/form.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = 'attachment; filename="form.pdf"'

# Keep the emailed URL stable when the signing provider link changes.
[[redirects]]
  from = "/esign-form"
  to = "https://www.jotform.com/sign/262532036293050/invite/01m27qbgg5b4354906e62a254f"
  status = 302

[[redirects]]
  from = "/Frontier_Cascadia.pdf"
  to = "/form.pdf"
  status = 301

[[redirects]]
  from = "/Frontier_Cascadia_Consent_Signature.pdf"
  to = "/form.pdf"
  status = 301

# Existing website routes now serve the submission homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
